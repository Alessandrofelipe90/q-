    <script>
    // Dispara evento de carregamento (mantido para o seu Google Tag Manager)
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'event': 'vsl_page_load' });

    const tempoDelay = 10000; // 10 segundos para o botão aparecer

    setTimeout(function() {
        document.getElementById('btn-cta').classList.remove('escondido');
        window.dataLayer.push({ 'event': 'vsl_pitch_reached' });
    }, tempoDelay);

    // Ao clicar no CTA principal, esconde o botão e mostra o formulário
    document.getElementById('btn-cta').addEventListener('click', function() {
        this.classList.add('escondido');
        document.getElementById('checkout-area').classList.remove('escondido');
        window.dataLayer.push({ 'event': 'checkout_intent' });
        document.getElementById('checkout-area').scrollIntoView({ behavior: 'smooth' });
    });

    // Apenas valida os campos e redireciona (SEM MAKE)
    document.getElementById('btn-gerar-pix').addEventListener('click', function() {
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const cpf = document.getElementById('cpf').value;

        // Verifica se os campos estão preenchidos
        if(!nome || !email || !cpf) {
            alert("Por favor, preencha todos os campos para continuar.");
            return;
        }

        const btn = document.getElementById('btn-gerar-pix');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> A redirecionar...';
        btn.classList.add('opacity-80', 'cursor-not-allowed');

        // Redireciona diretamente para a página de vendas da CRC Brasil
        window.location.href = "https://crcbrasil.com.br/servicos/mais-solicitadas/nascimento/?utm_source=gadsadeasyhub&utm_medium=cpc&utm_campaign=adeasyhub";
    });
</script>
