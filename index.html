<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação Exclusiva</title>
    
    <!-- Google Tag Manager - Substitua GTM-XXXXXXX pelo seu ID -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; color: #d32f2f; margin-bottom: 20px; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            margin-bottom: 30px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Botão e Checkout ocultos inicialmente */
        .escondido { display: none; }
        
        .btn-comprar {
            background-color: #28a745;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .checkout-form {
            margin-top: 30px;
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .checkout-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .pix-area { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="container">
        <!-- Headline -->
        <h1>[Você vai vender ainda essa noite com o Google mesmo se nao tiver um produto e não souber nada da ferramenta.]</h1>

        <!-- Vídeo de Vendas (Prefira VTurb, Vimeo ou Wistia para ocultar controles) -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/UudPguKqxe8?autoplay=1&controls=0&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <!-- Botão CTA (Aparece no Pitch) -->
        <button id="btn-cta" class="btn-comprar escondido">Quero Garantir Meu Acesso</button>

        <!-- Formulário de Checkout PIX -->
        <div id="checkout-area" class="checkout-form escondido">
            <h3>Preencha seus dados para receber o acesso:</h3>
            <input type="text" id="nome" placeholder="Nome Completo" required>
            <input type="email" id="email" placeholder="E-mail principal" required>
            <input type="text" id="cpf" placeholder="CPF" required>
            <button id="btn-gerar-pix" class="btn-comprar" style="width: 100%; font-size: 18px;">Gerar PIX</button>
            
            <!-- Área onde o QR Code e o Copia e Cola vão aparecer -->
            <div id="resultado-pix" class="pix-area escondido">
                <p>Escaneie o QR Code abaixo ou copie o código:</p>
                <img id="qr-code-img" src="" alt="QR Code PIX" style="max-width: 200px;">
                <input type="text" id="copia-cola" readonly>
                <p style="font-size: 12px; color: #666;">Seu acesso será enviado para o e-mail em até 1 minuto após o pagamento.</p>
            </div>
        </div>
    </div>

    <script>
        // Dispara evento de carregamento
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'event': 'vsl_page_load' });

        const tempoDelay = 10000; // 10 segundos

        setTimeout(function() {
            document.getElementById('btn-cta').classList.remove('escondido');
            window.dataLayer.push({ 'event': 'vsl_pitch_reached' });
        }, tempoDelay);

        document.getElementById('btn-cta').addEventListener('click', function() {
            this.classList.add('escondido');
            document.getElementById('checkout-area').classList.remove('escondido');
            window.dataLayer.push({ 'event': 'checkout_intent' });
        });

        // --- GERAÇÃO DO PIX VIA API (MAKE) ---
        document.getElementById('btn-gerar-pix').addEventListener('click', function() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;

            if(!nome || !email || !cpf) {
                alert("Preencha todos os campos!");
                return;
            }

            document.getElementById('btn-gerar-pix').innerText = "A gerar PIX...";

            // A tua URL do Make já está aqui configurada:
            const webhookMake = "https://hook.us2.make.com/ecvvsrueyqrrdl6maljfotcexvsl3h48";

            fetch(webhookMake, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: nome, email: email, cpf: cpf })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('resultado-pix').classList.remove('escondido');
                if(data.qr_code_base64) {
                    document.getElementById('qr-code-img').src = 'data:image/jpeg;base64,' + data.qr_code_base64;
                }
                if(data.qr_code) {
                    document.getElementById('copia-cola').value = data.qr_code;
                }
                document.getElementById('btn-gerar-pix').innerText = "Gerar PIX";
            })
            .catch(error => {
                alert("Erro ao gerar o PIX. Tente novamente.");
                document.getElementById('btn-gerar-pix').innerText = "Gerar PIX";
            });
        });
    </script>
